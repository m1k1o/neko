services:
  neko:
    image: neko-m1-demo:local
    build:
      context: ..
      dockerfile: demo/Dockerfile.local
    container_name: neko-m1-demo
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:8080:8080"
      - "${NEKO_DEMO_MEDIA_BIND:-127.0.0.1}:52000:52000/tcp"
      - "${NEKO_DEMO_MEDIA_BIND:-127.0.0.1}:52000:52000/udp"
    environment:
      NEKO_DESKTOP_SCREEN: 1280x720@30
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_DEMO_USER_PASSWORD:?set NEKO_DEMO_USER_PASSWORD}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_DEMO_ADMIN_PASSWORD:?set NEKO_DEMO_ADMIN_PASSWORD}
      NEKO_WEBRTC_CONNECTIVITY_MODE: direct
      NEKO_WEBRTC_NAT1TO1: ${NEKO_DEMO_NAT_IP:-127.0.0.1}
      NEKO_WEBRTC_UDPMUX: 52000
      NEKO_WEBRTC_TCPMUX: 52000
