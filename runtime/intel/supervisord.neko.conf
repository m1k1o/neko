# supervisord reads the files matched by [include] after the main config, and
# the last definition of a program wins, so this overrides the [program:neko]
# block from /etc/neko/supervisord.conf. Only the intel image ships
# /usr/bin/neko-serve. Keep the two blocks in sync.
[program:neko]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/neko-serve --server.static "/var/www"
stopsignal=INT
stopwaitsecs=3
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/neko.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true
