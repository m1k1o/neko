name: Build Branch Test Image

# Trigger by adding a label named "build:<app>" to a PR, e.g. "build:firefox"
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  packages: write

jobs:
  build-client:
    name: Build Client
    if: startsWith(github.event.label.name, 'build:')
    uses: ./.github/workflows/client_build.yml

  build-base:
    name: Build Base Image
    runs-on: ubuntu-latest
    needs: build-client
    outputs:
      branch_tag: ${{ steps.branch.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize branch name for Docker tag
        id: branch
        run: |
          TAG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client
          path: client/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Generate base Dockerfile
        run: go run utils/docker/main.go -i Dockerfile.tmpl -o Dockerfile -client client/dist

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          tags: ghcr.io/${{ github.repository }}/base:${{ steps.branch.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-app:
    name: Build App Image
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract app name from label
        id: app
        env:
          LABEL: ${{ github.event.label.name }}
        run: echo "name=${LABEL#build:}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ steps.app.outputs.name }}
          file: apps/${{ steps.app.outputs.name }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ steps.app.outputs.name }}:${{ needs.build-base.outputs.branch_tag }}
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/base:${{ needs.build-base.outputs.branch_tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
